name: Harbor oracle verification

# Runs the real Harbor oracle trial for the submitted tasks on a GitHub runner
# (Docker is preinstalled there) and asserts reward == 1.0.
#
# Triggers: push to main/master, or manually from the Actions tab.
#
#   harbor-oracle        -> exam_001, real Harbor oracle trial
#   docker-only-check    -> exam_001, Docker-only replay (no Harbor/uv)
#   exam003-harbor-oracle-> exam_003, real Harbor oracle trial
#   exam003-docker-check -> exam_003, Docker-only replay + negative controls

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  harbor-oracle:
    name: Harbor v0.5.0 oracle trial (exam_001)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout submitted task
        uses: actions/checkout@v4

      - name: Runner info
        run: |
          docker version
          docker compose version || true

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone Harbor v0.5.0
        run: |
          git clone --depth 1 --branch v0.5.0 https://github.com/laude-institute/harbor.git harbor \
            || git clone --depth 1 --branch v0.5.0 https://github.com/harbor-framework/harbor.git harbor
          git -C harbor describe --tags --always

      - name: Run oracle trial
        id: oracle
        continue-on-error: true
        working-directory: harbor
        env:
          PYTHONUTF8: "1"
        run: |
          uv run harbor trials start -p "$GITHUB_WORKSPACE/exam_001" -a oracle 2>&1 \
            | tee "$GITHUB_WORKSPACE/trial.log"

      - name: Show trial output
        if: always()
        run: |
          echo "===== trials tree ====="
          find harbor/trials -maxdepth 4 -type f 2>/dev/null | sort || true
          echo "===== verifier stdout (tests/test_outputs.py) ====="
          cat harbor/trials/*/verifier/test-stdout.txt 2>/dev/null || true
          echo "===== tests/test.sh log ====="
          cat harbor/trials/*/verifier/test-output.log 2>/dev/null || true
          echo "===== reward.txt ====="
          cat harbor/trials/*/verifier/reward.txt 2>/dev/null || true

      - name: Assert reward == 1.0
        if: always()
        run: |
          REWARD_FILE="$(find harbor/trials -name reward.txt 2>/dev/null | head -n1)"
          if [ -z "$REWARD_FILE" ]; then
            echo "FAIL: no /logs/verifier/reward.txt was produced by the trial"
            exit 1
          fi
          REWARD="$(tr -d ' \r\n' < "$REWARD_FILE")"
          echo "reward=$REWARD (from $REWARD_FILE)"
          if [ "$(printf '%.1f' "$REWARD")" = "1.0" ]; then
            echo "PASS: oracle reward = 1.0"
          else
            echo "FAIL: expected reward 1.0"
            exit 1
          fi

      - name: Upload trial artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-oracle-trial-exam001
          path: |
            harbor/trials
            trial.log
          if-no-files-found: warn

  docker-only-check:
    name: Docker-only simulation (exam_001)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout submitted task
        uses: actions/checkout@v4

      - name: Build image, run solve.sh, run test.sh
        run: bash ci/docker_oracle_check.sh exam_001

  exam003-harbor-oracle:
    name: Harbor oracle trial (exam_003)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout submitted task
        uses: actions/checkout@v4

      - name: Runner info
        run: |
          docker version
          docker compose version || true

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # exam_003 declares schema_version = "1.1"; v0.5.0 is kept as the fallback
      # in case the current main has drifted.
      - name: Clone Harbor
        run: |
          git clone --depth 1 https://github.com/laude-institute/harbor.git harbor \
            || git clone --depth 1 --branch v0.5.0 https://github.com/laude-institute/harbor.git harbor \
            || git clone --depth 1 https://github.com/harbor-framework/harbor.git harbor
          git -C harbor log --oneline -1 || true
          git -C harbor describe --tags --always || true
          uv run --directory harbor harbor --version || true

      - name: Run oracle trial
        continue-on-error: true
        working-directory: harbor
        env:
          PYTHONUTF8: "1"
        run: |
          uv run harbor trials start -p "$GITHUB_WORKSPACE/exam_003" -a oracle 2>&1 \
            | tee "$GITHUB_WORKSPACE/trial-exam003.log"

      - name: Show trial output
        if: always()
        run: |
          echo "===== trials tree ====="
          find harbor/trials -maxdepth 5 -type f 2>/dev/null | sort || true
          echo "===== reward.json ====="
          find harbor/trials -name 'reward.json' -exec sh -c 'echo "== $1"; cat "$1"; echo' _ {} \; 2>/dev/null || true
          echo "===== verifier logs ====="
          { find harbor/trials -path '*verifier*' -type f \( -name '*.txt' -o -name '*.log' \) 2>/dev/null || true; } | while read -r f; do
            echo "== $f"; cat "$f" || true
          done
          echo "===== oracle.txt (solve.sh stdout) ====="
          find harbor/trials -name 'oracle.txt' -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; 2>/dev/null || true

      - name: Assert reward == 1.0
        if: always()
        run: |
          REWARD_FILE="$(find harbor/trials -name 'reward.json' 2>/dev/null | head -n1)"
          if [ -z "$REWARD_FILE" ]; then
            echo "FAIL: no /logs/verifier/reward.json was produced by the trial"
            exit 1
          fi
          echo "reward.json: $(cat "$REWARD_FILE")"
          REWARD="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["reward"])' "$REWARD_FILE")"
          echo "reward=$REWARD (from $REWARD_FILE)"
          if [ "$(printf '%.1f' "$REWARD")" = "1.0" ]; then
            echo "PASS: exam_003 oracle reward = 1.0"
          else
            echo "FAIL: expected reward 1.0"
            exit 1
          fi

      - name: Upload trial artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-oracle-trial-exam003
          path: |
            harbor/trials
            trial-exam003.log
          if-no-files-found: warn

  exam003-docker-check:
    name: Docker-only simulation + negative controls (exam_003)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout submitted task
        uses: actions/checkout@v4

      - name: Run solve.sh in the built image, then the verifier
        run: bash ci/docker_oracle_check_exam003.sh

  # Runs after the real Harbor trial. Downloads the trial's own artifact (which
  # contains the reward.json Harbor wrote) and re-runs the same three docker
  # cases with explicit exit codes, then commits everything into evidence/ so it
  # can be read from raw.githubusercontent.com without any token or login.
  # See evidence/README.md.
  exam003-evidence:
    name: exam_003 evidence (raw reward.json)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: exam003-harbor-oracle
    permissions:
      contents: write
    steps:
      - name: Checkout submitted task
        uses: actions/checkout@v4

      - name: Re-run solve.sh + verifier and capture reward.json
        run: |
          chmod +x ci/verify_and_record.sh
          bash ci/verify_and_record.sh exam_003 evidence
          echo "---- evidence/ ----"
          find evidence -type f | sort

      # Exactly one file under evidence/ is Harbor's own output; the files
      # produced by ci/verify_and_record.sh are all named differently.
      - name: Fetch Harbor's own reward.json from the trial artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ci/fetch_trial_reward.sh \
            harbor-oracle-trial-exam003 evidence/harbor_oracle_reward.json

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exam003-evidence
          path: evidence
          if-no-files-found: error

      - name: Commit evidence back to the repository
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'xiaofang1998'
          git config user.email 'xiaofang1998@users.noreply.github.com'
          git add -f evidence
          if git diff --cached --quiet; then
            echo "evidence unchanged; nothing to commit"
          else
            git commit -m "evidence(exam_003): docker verifier reward + raw logs [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
