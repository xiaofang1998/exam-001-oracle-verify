name: exam_001 oracle verification

# Runs the real Harbor v0.5.0 oracle trial for the submitted task on a GitHub
# runner (Docker is preinstalled there), then asserts reward == 1.0.
#
# Trigger: push to main/master, or manually from the Actions tab.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  harbor-oracle:
    name: Harbor v0.5.0 oracle trial
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout submitted task
        uses: actions/checkout@v4

      - name: Runner info
        run: |
          docker version
          docker compose version || true

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone Harbor v0.5.0
        run: |
          git clone --depth 1 --branch v0.5.0 https://github.com/laude-institute/harbor.git harbor \
            || git clone --depth 1 --branch v0.5.0 https://github.com/harbor-framework/harbor.git harbor
          git -C harbor describe --tags --always

      - name: Run oracle trial
        id: oracle
        continue-on-error: true
        working-directory: harbor
        env:
          PYTHONUTF8: "1"
        run: |
          uv run harbor trials start -p "$GITHUB_WORKSPACE/exam_001" -a oracle 2>&1 \
            | tee "$GITHUB_WORKSPACE/trial.log"

      - name: Show trial output
        if: always()
        run: |
          echo "===== trials tree ====="
          find harbor/trials -maxdepth 4 -type f 2>/dev/null | sort || true
          echo "===== verifier stdout (tests/test_outputs.py) ====="
          cat harbor/trials/*/verifier/test-stdout.txt 2>/dev/null || true
          echo "===== tests/test.sh log ====="
          cat harbor/trials/*/verifier/test-output.log 2>/dev/null || true
          echo "===== reward.txt ====="
          cat harbor/trials/*/verifier/reward.txt 2>/dev/null || true

      - name: Assert reward == 1.0
        if: always()
        run: |
          REWARD_FILE="$(find harbor/trials -name reward.txt 2>/dev/null | head -n1)"
          if [ -z "$REWARD_FILE" ]; then
            echo "FAIL: no /logs/verifier/reward.txt was produced by the trial"
            exit 1
          fi
          REWARD="$(tr -d ' \r\n' < "$REWARD_FILE")"
          echo "reward=$REWARD (from $REWARD_FILE)"
          if [ "$(printf '%.1f' "$REWARD")" = "1.0" ]; then
            echo "PASS: oracle reward = 1.0"
          else
            echo "FAIL: expected reward 1.0"
            exit 1
          fi

      - name: Upload trial artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-oracle-trial
          path: |
            harbor/trials
            trial.log
          if-no-files-found: warn

  docker-only-check:
    name: Docker-only simulation (no Harbor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout submitted task
        uses: actions/checkout@v4

      - name: Build image, run solve.sh, run test.sh
        run: bash ci/docker_oracle_check.sh exam_001
